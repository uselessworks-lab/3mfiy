name: Bug report
description: Report a reproducible 3MF, API, or packaging problem.
body:
  - type: input
    id: version
    attributes:
      label: Version or Git commit
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and operating system
      placeholder: Node.js 22 / browser version; OS; slicer version if relevant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include code and expected versus actual behavior. Share only files you may redistribute.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics or error output
